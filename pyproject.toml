[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-platform-gateway"
version = "0.1.0"
description = "A secure AI platform gateway with FastMCP and guardrail enforcement."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
    "psutil",
    "pytest"
]

[tool.setuptools.packages.find]
where = ["src"]